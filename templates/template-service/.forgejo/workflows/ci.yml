# 合入门（PR 必过）。这里只放"快且判定明确"的三样：
#   gitleaks —— 扫全 git 历史里的密钥
#   trivy    —— 依赖 CVE + IaC 误配
#   semgrep  —— 源码缺陷
# DAST 不在这里：冷 PR 没有活 URL，见 dast.yml。
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    runs-on: debian-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 扫历史必须全量，浅克隆会漏
      - run: |
          curl -fsSL -o /tmp/gl.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gl.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - run: gitleaks detect --source . --redact --verbose --exit-code 1

  trivy:
    runs-on: debian-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL -o /tmp/tv.tar.gz \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          tar -xzf /tmp/tv.tar.gz -C /usr/local/bin trivy
          trivy --version
      - name: 依赖 CVE（HIGH/CRITICAL 阻断）
        run: trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress .
      - name: IaC / Dockerfile 误配
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --no-progress .

  semgrep:
    runs-on: debian-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet --break-system-packages semgrep && semgrep --version
      # 规则集放仓内，不用浮动的 p/default：在线规则库会在上游变，
      # 同一份代码今天绿明天红，且每次扫描都依赖外网可达。
      - run: semgrep scan --config .semgrep.yml --error --quiet --metrics=off .
