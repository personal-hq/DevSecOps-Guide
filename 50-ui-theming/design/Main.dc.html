<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <style>
    body { margin:0; font-family:Inter,-apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
           font-size:14px; line-height:1.45; color:#17191f; background:#fafafb;
           -webkit-font-smoothing:antialiased; }
    a { color:#3f4585; text-decoration:none; } a:hover { color:#2f3468; text-decoration:underline; }
    .mono { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  </style>
</helmet>

<div style="min-height:760px; display:flex; flex-direction:column; background:#fafafb">

  <!-- 顶栏：登录态之前只留品牌 + 语言，去掉"帮助"这类外链 -->
  <div style="display:flex; align-items:center; justify-content:space-between; height:52px; padding:0 20px; background:#fff; border-bottom:1px solid #e3e5ea">
    <div style="display:flex; align-items:center; gap:9px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="#454b8c" stroke-width="1.6"/>
        <circle cx="8.5" cy="8" r="1.9" fill="#454b8c"/>
        <circle cx="8.5" cy="16" r="1.9" fill="#454b8c"/>
        <circle cx="15.5" cy="12" r="1.9" fill="#454b8c"/>
        <path d="M8.5 9.9v4.2M10.2 8.9l3.7 2.2M10.2 15.1l3.7-2.2" stroke="#454b8c" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span style="font-size:14px; font-weight:600; letter-spacing:-.01em">ACME 代码仓库</span>
    </div>
    <span style="font-size:13px; color:#8b91a0">简体中文</span>
  </div>

  <!-- 登录卡：380px，不是原来那种 800px 大板 -->
  <div style="flex-grow:1; display:flex; align-items:flex-start; justify-content:center; padding:76px 20px 0">
    <div style="width:380px; display:flex; flex-direction:column; gap:16px">

      <div style="display:flex; flex-direction:column; gap:4px">
        <h1 style="margin:0; font-size:19px; font-weight:600; line-height:1.3; letter-spacing:-.01em">登录</h1>
        <div style="font-size:13px; color:#5a6070">使用公司账号访问内部代码仓库</div>
      </div>

      <div style="background:#fff; border:1px solid #e3e5ea; border-radius:12px; padding:18px; display:flex; flex-direction:column; gap:14px">

        <div style="display:flex; flex-direction:column; gap:6px">
          <label style="font-size:13px; font-weight:500; color:#3d4150">用户名</label>
          <div style="height:36px; border:1px solid #e3e5ea; border-radius:8px; background:#fff; display:flex; align-items:center; padding:0 11px">
            <span style="font-size:14px; color:#b0b5c0">zhangsan</span>
          </div>
        </div>

        <div style="display:flex; flex-direction:column; gap:6px">
          <label style="font-size:13px; font-weight:500; color:#3d4150">密码</label>
          <!-- 聚焦态：1px 描边 + 3px 低透明度光环，不是粗边框 -->
          <div style="height:36px; border:1px solid #9aa0c4; border-radius:8px; background:#fff; box-shadow:0 0 0 3px rgba(69,75,140,.10); display:flex; align-items:center; justify-content:space-between; padding:0 11px">
            <span class="mono" style="font-size:14px; color:#17191f; letter-spacing:.14em">••••••••••</span>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12Z" stroke="#8b91a0" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="2.6" stroke="#8b91a0" stroke-width="1.6"/>
            </svg>
          </div>
        </div>

        <div style="display:flex; align-items:center; gap:7px">
          <div style="width:15px; height:15px; border:1px solid #cfd2da; border-radius:4px; background:#fff"></div>
          <span style="font-size:13px; color:#3d4150">记住此设备</span>
        </div>

        <!-- 按钮：36px 高、克制的深靛蓝，不是原来那条饱和大色带 -->
        <div style="height:36px; border-radius:8px; background:#454b8c; display:flex; align-items:center; justify-content:center">
          <span style="font-size:14px; font-weight:500; color:#fff">登录</span>
        </div>
      </div>

      <!-- 忘记密码：一行文字链接，不再是一张独立的卡 -->
      <div style="display:flex; justify-content:center">
        <a href="#" style="font-size:13px">忘记密码？</a>
      </div>

      <div style="border-top:.5px solid #edeef1; padding-top:12px; display:flex; justify-content:center">
        <span style="font-size:11.5px; color:#8b91a0">仅限 ACME 员工访问 · 问题联系 <span class="mono">#it-support</span></span>
      </div>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
